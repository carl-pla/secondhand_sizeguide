name: Nightly Vinted Scraper

on:
  schedule:
    - cron: '0 2 * * *'   # 04:00 deutsche Zeit
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Welche User sollen gescrapt werden?
  # Lädt alle aktiven User aus MongoDB und baut
  # daraus eine Matrix für die parallelen Jobs.
  # ─────────────────────────────────────────────
  load-users:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.get-users.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: User-IDs aus MongoDB laden
        id: get-users
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
        run: |
          python - <<'EOF'
          import json, os, sys
          sys.path.insert(0, ".")
          from database.users import lade_alle_user

          users = lade_alle_user()
          # Nur die E-Mails als Matrix-Werte — runner.py kennt sie bereits
          emails = [u["email"] for u in users]
          matrix = json.dumps(emails)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix}\n")

          print(f"✅ {len(emails)} User gefunden: {emails}")
          EOF

  # ─────────────────────────────────────────────
  # JOB 2: Pro User ein paralleler Scrape-Job
  # Jeder Runner bekommt genau eine E-Mail und
  # scrapt + bewertet Artikel mit Ollama/LLM.
  # Ergebnisse landen in MongoDB (scraping_sessions).
  # ─────────────────────────────────────────────
  scrape-per-user:
    needs: load-users # Wartet bis Job 1 die Matrix gebaut hat
    runs-on: ubuntu-latest
    strategy:
      matrix:
        email: ${{ fromJson(needs.load-users.outputs.matrix) }}
      fail-fast: false      # ein fehlgeschlagener User stoppt nicht die anderen
      max-parallel: 10      # alle gleichzeitig (GitHub Free erlaubt 20)


    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Playwright Browser installieren
        run: playwright install chromium --with-deps

      - name: Ollama Setup
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 10
          ollama pull llama3.2:3b
      # Eigentlicher Scrape – runner.py weiß durch TARGET_USER_EMAIL
      # welcher User gerade dran ist.  
      - name: Scrape für ${{ matrix.email }}
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          TARGET_USER_EMAIL: ${{ matrix.email }}
        run: python runner.py
        # ↑ neues kleines Wrapper-Script (siehe unten)
        timeout-minutes: 15