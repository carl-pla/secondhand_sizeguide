name: Nightly Vinted Scraper
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  load-users:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.get-users.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: User-IDs aus MongoDB laden
        id: get-users
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
        run: |
          python - <<'EOF'
          import json, os, sys
          sys.path.insert(0, ".")
          from database.users import lade_alle_user
          users = lade_alle_user()
          emails = [u["email"] for u in users]
          matrix = json.dumps(emails)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix}\n")
          print(f"✅ {len(emails)} User gefunden: {emails}")
          EOF

  scrape-per-user:
    needs: load-users
    runs-on: ubuntu-latest
    strategy:
      matrix:
        email: ${{ fromJson(needs.load-users.outputs.matrix) }}
      fail-fast: false
      max-parallel: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Playwright Browser installieren
        run: playwright install chromium --with-deps
      - name: Ollama Setup
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do
            ollama list 2>/dev/null && break
            echo "Warte auf Ollama... ($i)"
            sleep 2
          done
          ollama pull llama3.2:3b
      - name: Scrape für ${{ matrix.email }}
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          TARGET_USER_EMAIL: ${{ matrix.email }}
        run: python runner.py
        timeout-minutes: 15