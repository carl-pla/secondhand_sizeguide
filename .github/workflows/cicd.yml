name: CI/CD & Daily Scraper

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      # --- TEST UMGEBUNG (Deine Scraper Logik) ---
      - name: MongoDB Service
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: '7.0'

      - name: Ollama Setup (für Tests/Scraping)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3.2:3b

      - name: Run Pytests (Dummy oder Scraper Check)
        run: pytest tests/dummy_test.py 

      # --- DOCKER BEREICH (Das eigentliche CI/CD) ---
      - name: Login to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vinted-app:latest
            ghcr.io/${{ github.repository_owner }}/vinted-app:${{ github.sha }}

  # --- OPTIONAL: DEPLOY CHECK ---
  deploy-check:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Status Report
        run: echo "Image successfully built and pushed to GHCR."