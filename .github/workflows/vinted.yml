name: Vinted Scraper

on:
  # Manuell starten
  workflow_dispatch:

  # Automatisch: Mo, Mi, Fr um 09:00 Uhr
  schedule:
    - cron: "0 9 * * 1,3,5"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Code auschecken ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python Setup ──
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Dependencies installieren ──
      - name: Dependencies installieren
        run: |
          pip install playwright playwright-stealth httpx
          playwright install chromium
          playwright install-deps chromium

      # ── 4. Ollama installieren & starten ──
      - name: Ollama installieren
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Ollama starten & Modell laden
        run: |
          ollama serve &
          sleep 5
          ollama pull llama3
        env:
          OLLAMA_HOST: "0.0.0.0:11434"

      # ── 5. Config aus GitHub Secrets laden ──
      - name: Config aus Secret erstellen
        run: |
          mkdir -p secrets
          echo '${{ secrets.VINTED_CONFIG }}' > secrets/config.json
          # Ollama URL für CI anpassen (lokaler Port)
          python3 -c "
          import json
          with open('secrets/config.json') as f:
              c = json.load(f)
          c['ollama_url'] = 'http://localhost:11434/api/generate'
          with open('secrets/config.json', 'w') as f:
              json.dump(c, f)
          "

      # ── 6. Scraper ausführen (headless) ──
      - name: Scraper ausführen
        run: |
          # headless=True für CI – in vinted_ollama.py Zeile anpassen:
          # browser = await p.chromium.launch(headless=True)
          python3 vinted_ollama.py --config secrets/config.json
        timeout-minutes: 30

      # ── 7. Ergebnisse als Artifact hochladen ──
      - name: Ergebnisse speichern
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vinted-ergebnisse-${{ github.run_id }}
          path: |
            secrets/vinted_ergebnisse.json
            secrets/vinted_empfehlungen.json
          retention-days: 30

      # ── 8. Optional: Ergebnisse committen ──
      - name: Ergebnisse in Repo committen
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add secrets/vinted_ergebnisse.json secrets/vinted_empfehlungen.json || true
          git diff --staged --quiet || git commit -m "🛍️ Vinted Ergebnisse $(date '+%Y-%m-%d')"
          git push || true
