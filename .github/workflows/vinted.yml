name: Vinted Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1,3,5"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Dependencies installieren
        run: |
          pip install playwright playwright-stealth httpx streamlit
          pip install -e .
          playwright install chromium
          playwright install-deps chromium

      - name: Ollama installieren
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Ollama starten & Modell laden
        run: |
          ollama serve &
          sleep 8
          ollama pull llama3
        env:
          OLLAMA_HOST: "0.0.0.0:11434"

      - name: Ollama URL für CI anpassen
        run: |
          python3 -c "
          import json
          with open('secrets/config.json') as f:
              c = json.load(f)
          c['ollama_url'] = 'http://localhost:11434/api/generate'
          with open('secrets/config.json', 'w') as f:
              json.dump(c, f)
          "

      - name: Scraper ausführen
        run: python3 main.py --config secrets/config.json
        timeout-minutes: 30

      - name: Ergebnisse als Artifact hochladen
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vinted-ergebnisse-${{ github.run_id }}
          path: |
            database/vinted_ergebnisse.json
            database/vinted_empfehlungen.json
          retention-days: 30
